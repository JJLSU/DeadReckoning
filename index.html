<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Dead Reckoning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;900&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ebe3cb; --panel:#f4eedd; --panel2:#e3d9bd; --ink:#1f2a2e; --dim:#5f665f;
  --line:#c8bb95; --magenta:#9b2a68; --chart:#2f5d7c; --good:#4d6b2a; --bad:#a3301f;
  --btn:#1f2a2e; --btnink:#f4eedd;
  --display:"Big Shoulders Stencil Display", Impact, "Arial Narrow", sans-serif;
  --body:"IBM Plex Sans Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141a1c; --panel:#1b2326; --panel2:#243034; --ink:#e8e1cc; --dim:#9aa39a;
    --line:#34443f; --magenta:#d45a9d; --chart:#79a9c9; --good:#9cc063; --bad:#e3644c;
    --btn:#e8e1cc; --btnink:#141a1c;
  }
}
:root[data-theme="dark"]{
  --paper:#141a1c; --panel:#1b2326; --panel2:#243034; --ink:#e8e1cc; --dim:#9aa39a;
  --line:#34443f; --magenta:#d45a9d; --chart:#79a9c9; --good:#9cc063; --bad:#e3644c;
  --btn:#e8e1cc; --btnink:#141a1c;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:#10150f;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:var(--body);-webkit-tap-highlight-color:transparent}
#game{position:relative;width:100%;height:100%;overflow:hidden}
#cv{display:block;width:100%;height:100%;touch-action:none;filter:saturate(.84) contrast(1.07)}
button{font-family:var(--body);cursor:pointer}
button:focus-visible{outline:2px solid var(--magenta);outline-offset:2px}
.hb{position:absolute;z-index:5;background:rgba(14,18,16,.72);color:#efe6cf;border:1px solid rgba(239,230,207,.25);border-radius:6px;font-size:14px;font-weight:600;padding:9px 13px;letter-spacing:.02em}
.hb:active{background:rgba(155,42,104,.8)}
#btnMap{left:10px;bottom:12px}
#btnPause{left:78px;bottom:12px}
#btnHeal{left:10px;bottom:58px}
#btnThrow{right:12px;bottom:22px;background:rgba(120,40,20,.8)}
#btnJump{right:12px;bottom:70px}
#btnSwap{right:12px;bottom:118px}
#btnCruise{left:146px;bottom:12px}
#btnCruise.on{background:rgba(155,42,104,.85);border-color:#d45a9d}
#btnBoard{left:50%;bottom:22px;transform:translateX(-50%);background:#9b2a68;border-color:#d45a9d;font-size:16px;padding:12px 22px}
#btnTaxi{left:50%;bottom:22px;transform:translateX(-50%)}
#toasts{position:absolute;left:50%;top:190px;transform:translateX(-50%);z-index:6;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:min(92%,440px)}
.toast{background:rgba(14,18,16,.82);color:#efe6cf;font-size:14px;font-weight:500;padding:7px 12px;border-radius:5px;border-left:3px solid #d9a441;animation:tin .25s ease-out;text-align:center}
.toast.good{border-left-color:#9cc063}.toast.bad{border-left-color:#e3644c}.toast.mag{border-left-color:#d45a9d}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.toast{animation:none}}
.hidden{display:none!important}
.ov{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(8,10,9,.5);padding:12px;box-sizing:border-box}
.panel{background:var(--panel);color:var(--ink);width:100%;max-width:560px;max-height:100%;overflow:auto;border-radius:4px;box-shadow:0 18px 50px rgba(0,0,0,.45);padding:20px 20px 16px;box-sizing:border-box;touch-action:pan-y;-webkit-overflow-scrolling:touch;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:48px 48px;background-position:-1px -1px;background-blend-mode:normal}
.panel{background-image:none}
.panel h2{font-family:var(--display);font-weight:900;font-size:34px;line-height:1;margin:2px 0 8px;letter-spacing:.01em}
.panel h4{font-size:15px;margin:16px 0 6px;color:var(--chart);font-weight:700}
.panel p{font-size:15px;line-height:1.45;margin:6px 0 10px;max-width:62ch}
.kind{font-size:14px;color:var(--magenta);font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.tags span{font-size:13px;border:1px solid var(--magenta);color:var(--magenta);border-radius:3px;padding:2px 7px}
.tags span.off{border-color:var(--line);color:var(--dim)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:12px}
.stats div{background:var(--panel2);padding:7px 8px}
.stats b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.stats i{font-style:normal;font-size:12px;color:var(--dim)}
.tabs{display:flex;gap:0;border-bottom:2px solid var(--ink);margin-bottom:4px;overflow-x:auto}
.tabs button{background:none;border:none;color:var(--dim);font-size:15px;font-weight:600;padding:8px 12px}
.tabs button.on{background:var(--ink);color:var(--panel)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row .t{flex:1;min-width:0;font-size:15px;line-height:1.3}
.row .t small{display:block;color:var(--dim);font-size:13px}
.row .ic{font-size:22px;width:28px;text-align:center}
.b{background:var(--btn);color:var(--btnink);border:none;border-radius:3px;padding:9px 13px;font-size:14px;font-weight:600;white-space:nowrap}
.b.alt{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.b:disabled{opacity:.35;cursor:default}
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.go{background:var(--magenta);color:#fff;border:none;border-radius:3px;padding:12px 20px;font-size:17px;font-weight:700}
.go:disabled{opacity:.4}
.ghost{background:transparent;border:1px solid var(--ink);color:var(--ink);border-radius:3px;padding:12px 16px;font-size:15px;font-weight:600}
.empty{color:var(--dim);font-size:14px;padding:8px 0}
.note{font-style:italic;color:var(--dim);border-left:3px solid var(--magenta);padding-left:10px;font-size:14px!important}
.logo{font-family:var(--display);font-weight:900;font-size:clamp(54px,15vw,92px);line-height:.86;margin:0 0 4px;color:var(--ink)}
.logo span{display:block;color:var(--magenta)}
.sub{font-size:16px;color:var(--dim);margin-bottom:14px}
.help{font-size:14px;line-height:1.45}
.help dt{font-weight:700;color:var(--chart);margin-top:8px}
.help dd{margin:2px 0 0 0}
.stack{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.stack .go,.stack .ghost{width:100%}
.mapwrap{background:var(--panel);color:var(--ink);border-radius:4px;padding:12px;box-sizing:border-box;max-width:100%;max-height:100%;overflow:auto;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.maphead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.maphead strong{font-family:var(--display);font-size:26px;font-weight:900}
#mapCv{display:block;touch-action:none;border:1px solid var(--line)}
.mapnote{font-size:13px;color:var(--dim);margin-top:8px;max-width:60ch}
</style>
</head>
<body>
<div id="game">
  <canvas id="cv"></canvas>
  <button id="btnMap" class="hb hidden">Map</button>
  <button id="btnPause" class="hb hidden">Pause</button>
  <button id="btnHeal" class="hb hidden">Heal</button>
  <button id="btnThrow" class="hb hidden">Throw bomb</button>
  <button id="btnJump" class="hb hidden">Jump</button>
  <button id="btnSwap" class="hb hidden">Swap gun</button>
  <button id="btnCruise" class="hb hidden">Cruise ×3</button>
  <button id="btnBoard" class="hb hidden">Board plane</button>
  <button id="btnTaxi" class="hb hidden">Taxi back to hangar</button>
  <div id="toasts"></div>
  <div id="overlay" class="ov hidden"><div class="panel" id="panel"></div></div>
  <div id="mapOv" class="ov hidden">
    <div class="mapwrap">
      <div class="maphead"><strong>Chart</strong><button class="b" id="mapClose">Close chart</button></div>
      <canvas id="mapCv"></canvas>
      <div class="mapnote" id="mapNote"></div>
    </div>
  </div>
</div>
<script>
'use strict';
/* ================= utilities ================= */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const $=s=>document.querySelector(s);
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(ix,iy,s){let h=(Math.imul(ix|0,374761393)+Math.imul(iy|0,668265263)+Math.imul(s|0,1442695041))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296}
function vnoise(x,y,s){const ix=Math.floor(x),iy=Math.floor(y);let fx=x-ix,fy=y-iy;fx=fx*fx*(3-2*fx);fy=fy*fy*(3-2*fy);const a=hash(ix,iy,s),b=hash(ix+1,iy,s),c=hash(ix,iy+1,s),d=hash(ix+1,iy+1,s);return a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy}
function fbm(x,y,s,o){let v=0,amp=.5,f=1,n=0;for(let i=0;i<o;i++){v+=vnoise(x*f,y*f,s+i*31)*amp;n+=amp;amp*=.5;f*=2.03}return v/n}
function shuffle(a,r){for(let i=a.length-1;i>0;i--){const j=(r()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function angDiff(a,b){let d=(a-b)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const km=u=>Math.round(u/100);
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}

/* ================= audio ================= */
const AU={ctx:null,on:true,eng:null};
try{AU.on=localStorage.getItem('dr.sound')!=='off'}catch(e){}
function auInit(){
  if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return}
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C();AU.ctx=c;
  AU.master=c.createGain();AU.master.gain.value=AU.on?.6:0;AU.master.connect(c.destination);
  const b=c.createBuffer(1,c.sampleRate,c.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.noise=b;
  const o=c.createOscillator();o.type='sawtooth';const o2=c.createOscillator();o2.type='square';const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=400;
  const g=c.createGain();g.gain.value=0;o.connect(f);o2.connect(f);f.connect(g);g.connect(AU.master);o.start();o2.start();
  const n=c.createBufferSource();n.buffer=b;n.loop=true;const nf=c.createBiquadFilter();nf.type='lowpass';nf.frequency.value=380;nf.Q.value=.6;
  const ng=c.createGain();ng.gain.value=0;n.connect(nf);nf.connect(ng);ng.connect(AU.master);n.start();
  const rn=c.createBufferSource();rn.buffer=b;rn.loop=true;const rf=c.createBiquadFilter();rf.type='highpass';rf.frequency.value=1500;const rg=c.createGain();rg.gain.value=0;rn.connect(rf);rf.connect(rg);rg.connect(AU.master);rn.start(0,.3);
  AU.eng={o,o2,f,g,ng,rg};
}
function auEngine(thr,alt,active){
  if(!AU.ctx)return;const e=AU.eng,t=AU.ctx.currentTime,base=38+thr*62;
  e.o.frequency.setTargetAtTime(base,t,.1);e.o2.frequency.setTargetAtTime(base*.5+1.3,t,.1);e.f.frequency.setTargetAtTime(250+thr*900,t,.1);
  e.g.gain.setTargetAtTime(active?.05+thr*.09:0,t,.15);e.ng.gain.setTargetAtTime(active?.008+Math.min(1,alt/100)*.022:0,t,.3);
}
function sfx(kind,vv){
  if(!AU.ctx||!AU.on)return;const c=AU.ctx,t=c.currentTime;
  const noise=(dur,freq,q,vol,type)=>{const s=c.createBufferSource();s.buffer=AU.noise;const f=c.createBiquadFilter();f.type=type||'bandpass';f.frequency.value=freq;f.Q.value=q;
    const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(AU.master);s.start(t,Math.random()*.5);s.stop(t+dur+.05)};
  const tone=(f0,f1,dur,vol,type,dl)=>{dl=dl||0;const o=c.createOscillator();o.type=type||'sine';o.frequency.setValueAtTime(f0,t+dl);o.frequency.exponentialRampToValueAtTime(f1,t+dl+dur);
    const g=c.createGain();g.gain.setValueAtTime(.0001,t+dl);g.gain.exponentialRampToValueAtTime(vol,t+dl+.01);g.gain.exponentialRampToValueAtTime(.001,t+dl+dur);o.connect(g);g.connect(AU.master);o.start(t+dl);o.stop(t+dl+dur+.05)};
  switch(kind){
    case'pistol':noise(.18,1800,.7,.5);tone(180,60,.12,.3,'triangle');break;
    case'shotgun':noise(.35,900,.5,.8);tone(120,40,.2,.45,'triangle');break;
    case'rifle':noise(.25,2400,.8,.6);tone(220,50,.15,.35,'triangle');break;
    case'enemy':noise(.16,1400,.8,.25);break;
    case'hit':noise(.07,500,1,.18);break;
    case'hurt':tone(140,70,.18,.3,'square');break;
    case'loot':tone(660,660,.08,.14,'triangle');tone(990,990,.12,.14,'triangle',.08);break;
    case'cash':tone(880,880,.06,.1,'square');tone(1320,1320,.1,.1,'square',.06);break;
    case'groan':{const v=vv===undefined?.06:vv;if(v<.004)break;const f=62+Math.random()*30,d=.9+Math.random()*.5;const o=c.createOscillator();o.type='triangle';o.frequency.setValueAtTime(f*1.35,t);o.frequency.linearRampToValueAtTime(f,t+d);
      const lf=c.createOscillator();lf.frequency.value=4+Math.random()*4;const lg=c.createGain();lg.gain.value=5;lf.connect(lg);lg.connect(o.frequency);const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=320+Math.random()*260;bp.Q.value=2.5;
      const gg=c.createGain();gg.gain.setValueAtTime(.0001,t);gg.gain.exponentialRampToValueAtTime(v,t+.18);gg.gain.exponentialRampToValueAtTime(.0005,t+d);o.connect(bp);bp.connect(gg);gg.connect(AU.master);o.start(t);lf.start(t);o.stop(t+d+.05);lf.stop(t+d+.05);noise(d*.8,700,1.5,v*.5);break}
    case'scream':noise(.9,2300,3,.35);tone(700,1350,.7,.07,'square');tone(520,900,.7,.05,'sawtooth');break;
    case'pop':noise(.6,280,.6,.8,'lowpass');tone(150,45,.4,.3);break;
    case'boom':noise(1.1,200,.4,1.2,'lowpass');tone(80,25,.8,.6);break;
    case'thump':noise(.25,300,.7,.5,'lowpass');noise(.3,3000,2,.12);break;
    case'crash':noise(1.4,400,.3,1.2,'lowpass');noise(.8,2000,.5,.4);break;
    case'open':noise(.16,900,1.2,.22);tone(210,130,.14,.08,'triangle');break;
    case'safe':noise(.25,1600,2,.25);tone(320,180,.2,.12,'square');break;
    case'rare':tone(1320,1320,.35,.08,'triangle');tone(1760,1760,.4,.07,'triangle',.07);break;
    case'jackpot':[880,1100,1320,1760].forEach((f,i)=>tone(f,f,.3,.09,'triangle',i*.08));break;
    case'smg':noise(.07,2100,.9,.32);tone(200,80,.05,.15,'triangle');break;
    case'rifle2':noise(.16,2300,.8,.5);tone(240,55,.12,.3,'triangle');break;
    case'shotgun2':noise(.5,650,.5,1.1);tone(100,32,.3,.55,'triangle');break;
    case'bow':noise(.12,3200,2,.14);tone(320,190,.12,.08,'triangle');break;
    case'jump':noise(.14,700,1,.14);break;
    case'land':noise(.12,260,.7,.3,'lowpass');break;
    case'snarl':{const v=vv===undefined?.12:vv;noise(.55,900,2.2,v*2.2);tone(190,85,.5,v,'sawtooth');break}
    case'heart':{const v=vv===undefined?.2:vv;tone(58,40,.14,v);tone(52,36,.16,v*.8,'sine',.2);break}
    case'horde':noise(1.6,180,.4,.8,'lowpass');tone(90,60,1.4,.12,'sawtooth');break;
    case'siphon':noise(.35,500,3,.08);break;
    case'caw':tone(820,560,.13,.05,'square');tone(760,520,.13,.04,'square',.18);break;
    case'click':tone(1200,900,.04,.06,'square');break;
    case'swing':noise(.14,2600,1.2,.25);break;
    case'thunder':noise(2.4,110,.3,1.1,'lowpass');noise(.4,900,.5,.3);break;
    case'empty':tone(900,700,.03,.08,'square');break;
  }
}
function setSound(on){AU.on=on;try{localStorage.setItem('dr.sound',on?'on':'off')}catch(e){}if(AU.master)AU.master.gain.value=on?.6:0}
addEventListener('pointerdown',auInit,true);addEventListener('keydown',auInit,true);
function buzz(ms){try{if(navigator.vibrate)navigator.vibrate(ms)}catch(e){}}
const NOTES=['Pump still works if you kick it twice.','Went east with the Hendersons. Stay off the river, it is full of them.','Heard a voice on the emergency band again. Said Haven has doctors and a wall. Northeast, on the coast.','The fuel in the back room is spoken for. It is not. Take it.','The fast ones came from the hospital in town. Aim low.','Kept the runway lights on for three nights. Nobody came.','Nothing I own can cross the empty country to Haven. Get a twin or get bigger tanks.','Men with rifles in the next valley. They want planes, not people.','Radio says Haven sends a beacon at dusk. I never heard it.','Buried the mechanic behind the hangar. He would want you to use his tools.','Crosswind here comes off the ridge. Point the nose into it and crab on in.','Took the Heron north. Left you the Kestrel. Sorry about the oil leak.','We are not dead. We went to the church. Knock three times.','Fuel goes stale after a year. It has been fourteen months. Fly anyway.','Every shot brings more of them. Get in, get the cans, get out.','Red barrels in the yard are full of avgas. Keep your distance when you shoot one.'];

/* ================= data ================= */
const WORLD=30000;
const PLANES=[
 {name:'Kestrel',desc:'Two-seat taildragger. Forgiving, thirsty, short-legged.',max:140,stall:52,cruise:112,fuel:24,burn:.44,turn:1.15,slots:1,price:0,tankStep:8,tankMax:1,col:'#c9a866',acc:'#7a2f22',twin:false,size:34},
 {name:'Heron',desc:'High-wing utility hauler with room for three loads.',max:168,stall:60,cruise:138,fuel:32,burn:.5,turn:.98,slots:3,price:2800,tankStep:12,tankMax:3,col:'#93aaa5',acc:'#2d3b3a',twin:false,size:40},
 {name:'Albatross',desc:'Twin-engine bush liner. The only thing out here with real legs.',max:205,stall:70,cruise:170,fuel:80,burn:.6,turn:.82,slots:5,price:6500,tankStep:15,tankMax:2,col:'#dad3c0',acc:'#8a3b1e',twin:true,size:50},
];
const WEAPONS=[
 {name:'Revolver',dmg:30,rate:.36,pel:1,spr:.035,spd:950,life:.55,price:0,noise:2.5,snd:'pistol',kb:6,len:15},
 {name:'Pump shotgun',dmg:15,rate:.8,pel:6,spr:.3,spd:820,life:.36,price:650,noise:4,snd:'shotgun',kb:8,len:23},
 {name:'Lever rifle',dmg:65,rate:.5,pel:1,spr:.008,spd:1400,life:.62,price:1100,noise:3.5,snd:'rifle',kb:10,len:25},
 {name:'Submachine gun',dmg:17,rate:.085,pel:1,spr:.1,spd:950,life:.45,price:1500,noise:1.1,snd:'smg',kb:3,len:18},
 {name:'Assault rifle',dmg:30,rate:.13,pel:1,spr:.045,spd:1250,life:.6,price:2400,noise:1.8,snd:'rifle2',kb:6,len:25},
 {name:'Double-barrel',dmg:14,rate:1.05,pel:10,spr:.4,spd:800,life:.32,price:950,noise:6,snd:'shotgun2',kb:15,len:21},

function openPause(){if(ui!==null)return;showPanel(`<h2>Paused</h2><p class="note">${esc(objective())}</p><h4>Trinkets, ${G.trinkets.length} of ${TRINKETS.length}</h4>${G.trinkets.length?TRINKETS.filter(x=>G.trinkets.includes(x[0])).map(x=>`<div class="row"><div class="ic">⭐</div><div class="t">${esc(x[1])}<small>${esc(x[2])}</small></div></div>`).join(''):'<p class="empty">None yet. Safes and hidden stashes are the best places to look.</p>'}${helpHTML()}<div class="stack"><button class="go" data-a="resume">Resume</button><h4>Difficulty</h4><div class="tabs">${DIFFS.map((d,i)=>`<button data-a="diff" data-v="${i}" class="${G.diff===i?'on':''}">${d.name}</button>`).join('')}</div><p class="empty">${DIFFS[G.diff].desc}</p><button class="ghost" data-a="sound">${AU.on?'Turn sound off':'Turn sound on'}</button><button class="ghost" data-a="quit">Save and quit to title</button></div>`,'pause')}
function helpHTML(){return`<dl class="help">
<dt>Flying</dt><dd>Drag left or right anywhere on the left of the screen to steer. The bar on the right is the throttle. Keyboard: A and D steer, W and S set throttle.</dd>
<dt>Landing</dt><dd>Line up with a runway, then pull the throttle back to the pink approach mark, about a third, roughly 15 km out, and the plane settles onto the runway. A marker on the ground shows where you will touch down. Green means runway, amber means off the runway, red means you are sinking too fast. Wind pushes you sideways, so point the nose into it to hold your line. Touching down anywhere but a runway kills you, with one exception: a gentle landing lined up on a straight road. There is no pump or mechanic out there.</dd>
<dt>Jobs</dt><dd>Delivery jobs pay when you land at the destination. Rescue jobs send you to find a survivor hiding in a town. Walk up to them, lead them back to the plane, and fly them home. They can be bitten on the way.</dd>
<dt>The dead</dt><dd>Bloated ones burst into toxic gas when they die, so shoot them from range. Pale screamers call more of the dead when they see you, so drop them first.</dd>
<dt>Flying</dt><dd>Once you are above about 2,000 feet and clear of weather, tap Cruise or press C to fly three times faster. When you are low and near a charted runway, approach assist steers you onto the centerline as long as you let go of the stick. Radio maydays pop up on long flights and pay well if you land there in time.</dd>
<dt>Weather and damage</dt><dd>Storms drift across the map and show on your minimap as blue patches. Their cores shake the plane apart. Flying low over towns draws gunfire that can hole the hull or the fuel lines. Hard landings cost hull too. Mechanics patch everything for cash.</dd>
<dt>Noise</dt><dd>Your landing, gunfire, running, explosions, and siphoning fuel all fill the noise meter. At each mark a new wave of the dead arrives from the edges of the map. When it fills, the horde comes and does not stop. The crossbow and machete make no noise. Loot what you can and leave in time.</dd>
<dt>On foot</dt><dd>Left thumb moves, right thumb aims and fires. Keyboard and mouse: WASD and click. Hold Shift to run, Space to jump, Q to swap guns, H to heal, G to throw a pipe bomb. On a phone, push the left stick all the way to run. Jumping clears fences, sandbags, and car hoods, and nothing can bite you in the air. Running is loud, and some of the bodies on the ground are not dead. Walk over containers to burst them open, then collect what spills out. Rarer finds glow green, blue, or gold. Locked safes take a spare part or a bomb and hold the best loot, including trinkets with permanent perks. Houses sometimes hide stashes under loose floorboards that only show up close. Footlockers hold ammo, bombs, and armor. Registers hold cash and jewelry. Toolboxes hold spare parts for field repairs. Medicine cabinets hold bandages and antibiotics. Every airfield has a small town beside it with shops and houses to search. Roofs lift away when you step inside. Each shop stocks by its trade: the pharmacy has medicine, the hardware store has parts, the gun shop has ammo. Traders pay different prices for goods at each field. Old charts reveal fields and narrow down Haven. The dead sometimes drop rounds. When you run dry you fight with a machete. Red barrels explode when shot. Gunfire draws more of the dead the longer you stay. Night falls at 18:00, and the dead move faster in the dark. You can sleep in the cockpit from the hangar tab. Return to the plane to refuel, take jobs, and upgrade.</dd>
<dt>The goal</dt><dd>Haven lies somewhere in the far northeast, across empty country no starter plane can cross. Earn a bigger airframe or bigger tanks first.</dd></dl>`}
function act(a,v){
  const s=G?strips[G.strip]:null,P=G?PS():null;
  switch(a){
    case'tab':menuTab=v;renderMenu();break;
    case'close':closeUI();break;
    case'resume':closeUI();break;
    case'band':if(G.cash>=25){G.cash-=25;G.band++}renderMenu();break;
    case'bomb':if(G.cash>=60){G.cash-=60;G.bombs++}renderMenu();break;
    case'sell':{const n=G.goods[v]||0,pr=goodPrice(s,v);if(n){G.cash+=n*pr;G.goods[v]=0;toast(`Sold ${n} ${GOODS[v][0]} for $${n*pr}.`,'good');sfx('cash')}renderMenu();break}
    case'sellparts':if(G.parts>0){G.parts--;G.cash+=15}renderMenu();break;
    case'fieldfix':if(G.parts>0&&G.hull<100){G.parts--;G.hull=Math.min(100,G.hull+(has('gloves')?25:15));toast('Patched a section of the airframe.','good')}renderMenu();break;
    case'fieldleak':if(G.parts>=2&&G.leak>0){G.parts-=2;G.leak=0;toast('Fuel line sealed.','good')}renderMenu();break;
    case'repair':{const c=repairCost();if(c>0&&G.cash>=c){G.cash-=c;G.hull=100;G.leak=0;toast('The mechanic patches her up.','good')}renderMenu();break}
    case'sleep':{const m=G.time%1440;G.time+=(390-m+1440)%1440;G.hp=Math.min(100,G.hp+40);G.offers=genOffers(s);enterGround(s);checkpoint();toast(`Day ${day()}. You wake at first light.`,'good');break}
    case'sound':setSound(!AU.on);closeUI();openPause();break;
    case'diff':G.diff=+v;save();closeUI();openPause();toast(`Difficulty: ${DIFFS[G.diff].name}. It takes full effect at the next airfield.`,'mag');break;
    case'takeoff':takeoff();break;
    case'pour':{const n=Math.min(G.carried,P.fuelCap-G.fuel);G.fuel+=n;G.carried-=n;toast(`Poured ${n.toFixed(1)} gal.`);renderMenu();break}
    case'buy5':{const n=Math.min(5,P.fuelCap-G.fuel),c=Math.ceil(n*s.fuelPrice);if(G.cash>=c){G.cash-=c;G.fuel+=n}renderMenu();break}
    case'fill':{let n=P.fuelCap-G.fuel;n=Math.min(n,Math.floor(G.cash/s.fuelPrice));G.cash-=Math.ceil(n*s.fuelPrice);G.fuel+=n;renderMenu();break}
    case'accept':{const c=G.offers.splice(+v,1)[0];if(c){if(!c.id)c.id=Math.random().toString(36).slice(2);G.contracts.push(c);const tg=contractTarget(c);known.add(tg);known.add(c.dest);if(G.nav<0)G.nav=tg;toast(c.type==='rescue'?`Rescue job taken. Course set to ${strips[tg].name}.`:`Loaded ${c.what}. Course set to ${strips[tg].name}.`,'mag')}renderMenu();break}
    case'dump':G.contracts.splice(+v,1);renderMenu();break;
    case'nav':G.nav=+v;renderMenu();break;
    case'tank':{const c=450*(G.tanks+1)+G.plane*200;if(G.cash>=c&&G.tanks<P.tankMax){G.cash-=c;G.tanks++;toast('Auxiliary tank fitted.','good')}renderMenu();break}
    case'engine':{const c=600*(G.engine+1);if(G.cash>=c&&G.engine<2){G.cash-=c;G.engine++;toast('Engine overhauled.','good')}renderMenu();break}
    case'weapon':{const i=+v,w=WEAPONS[i];if(G.weapons.includes(i))G.weapon=i;else if(G.cash>=w.price){G.cash-=w.price;G.weapons.push(i);G.weapon=i;toast(`Bought the ${w.name.toLowerCase()}.`,'good')}renderMenu();break}
    case'ammo':if(G.cash>=35){G.cash-=35;G.ammo+=30}renderMenu();break;
    case'ammo100':if(G.cash>=100){G.cash-=100;G.ammo+=100}renderMenu();break;
    case'med':if(G.cash>=60){G.cash-=60;G.med++}renderMenu();break;
    case'plane':{const i=+v,cost=PLANES[i].price-Math.floor(PLANES[G.plane].price*.5);if(G.cash>=cost){G.cash-=cost;G.plane=i;G.tanks=0;G.engine=0;G.fuel=Math.min(G.fuel,PS().fuelCap);G.contracts=G.contracts.slice(0,PS().slots);toast(`The ${PLANES[i].name} is yours.`,'good')}renderMenu();break}
    case'newgame':startNew();break;
    case'continue':{const sv=loadSave();if(sv)resumeFrom(sv);break}
    case'retry':{const st=JSON.parse(CP);st.cash=Math.floor(st.cash*(st.diff===2?.8:.9));st.hp=100;resumeFrom(st);toast('You wake up in the hangar with a headache and a lighter wallet.','bad');break}
    case'quit':save();showTitle();break;
    case'help':showPanel(`<h2>How to fly</h2>${helpHTML()}<div class="stack"><button class="go" data-a="backtitle">Back</button></div>`,'title');break;
    case'backtitle':showTitle();break;
  }
}

function hudGround(){
  ctx.textBaseline='middle';const pw=Math.min(W-24,330),px=10,py=10;ctx.fillStyle='rgba(12,16,14,.74)';rr(ctx,px,py,pw,106,6);ctx.fill();

  ctx.fillStyle='#efe6cf';ctx.font='600 13px "IBM Plex Sans Condensed",sans-serif';
  ctx.fillText(`${G.ammo>0?WEAPONS[G.weapon].name+', '+G.ammo+' rounds':'Machete, no rounds'}   ${G.bombs} bomb${G.bombs===1?'':'s'}`,px+10,py+40);
  ctx.fillText(`${G.band} bandage${G.band===1?'':'s'}   ${G.med} medkit${G.med===1?'':'s'}   ${G.parts} part${G.parts===1?'':'s'}${G.armor>0?'   armor '+Math.ceil(G.armor):''}`,px+10,py+58);
  ctx.fillText(`$${G.cash}   ${Math.floor(G.carried)} gal in cans   ${S.zs.filter(z=>!z.dormant).length} dead in sight`,px+10,py+76);ctx.fillStyle=dark()>.5?'#9fb6e0':'#b9b09a';ctx.fillText(`Day ${day()}, ${clock()}${dark()>.5?'. Night, they move faster':''}`,px+10,py+94);

  ctx.fillStyle='rgba(200,196,188,.2)';for(const a of ASH){const x=((a.x+T*.012*a.s+Math.sin(T*.7+a.o)*.01)%1+1)%1*W,y=((a.y+T*.02*a.s)%1)*H;ctx.beginPath();ctx.arc(x,y,.8+a.s*.7,0,TAU);ctx.fill()}
  drawObjective(py+112);
  {const nx=10,ny=py+162,nw=Math.min(W-24,220),f=S.noise/100;ctx.fillStyle='rgba(12,16,14,.74)';rr(ctx,nx,ny,nw,20,5);ctx.fill();ctx.fillStyle='rgba(255,255,255,.1)';ctx.fillRect(nx+56,ny+7,nw-64,6);
    ctx.fillStyle=f>=1?(T%.4<.2?'#ff5a3a':'#a3301f'):f>.65?'#e3644c':f>.35?'#e0a040':'#b9b09a';ctx.fillRect(nx+56,ny+7,(nw-64)*f,6);ctx.fillStyle='rgba(0,0,0,.5)';for(const q of [.35,.65])ctx.fillRect(nx+56+(nw-64)*q-1,ny+5,2,10);
    ctx.font='600 11px "IBM Plex Sans Condensed",sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillStyle=f>=1?'#ff8a70':'#efe6cf';ctx.fillText(f>=1?'HORDE':'Noise',nx+8,ny+10)}
  if(!S.npc&&G.contracts.length){const gs=groundScale(),sx=W/2+(S.plane.x-S.cx)*gs,sy=H/2+(S.plane.y-S.cy)*gs;if(sx<20||sx>W-20||sy<150||sy>H-20){const a=Math.atan2(sy-H/2,sx-W/2),ex=clamp(sx,34,W-34),ey=clamp(sy,170,H-40);ctx.save();ctx.translate(ex,ey);ctx.rotate(a);ctx.fillStyle='#f2b64a';ctx.strokeStyle='rgba(0,0,0,.6)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(-8,-10);ctx.lineTo(-8,10);ctx.closePath();ctx.stroke();ctx.fill();ctx.restore();ctx.font='700 11px "IBM Plex Sans Condensed",sans-serif';ctx.textAlign='center';ctx.fillStyle='#f3d38c';ctx.fillText('Plane',ex-Math.cos(a)*24,ey-Math.sin(a)*18)}}
  if(S.npc){const n=S.npc,gs=groundScale(),sx=W/2+(n.x-S.cx)*gs,sy=H/2+(n.y-S.cy)*gs;if(sx<20||sx>W-20||sy<150||sy>H-20){const a=Math.atan2(sy-H/2,sx-W/2),ex=clamp(sx,30,W-30),ey=clamp(sy,170,H-40);ctx.save();ctx.translate(ex,ey);ctx.rotate(a);ctx.fillStyle='#e07ab3';ctx.beginPath();ctx.moveTo(12,0);ctx.lineTo(-7,-8);ctx.lineTo(-7,8);ctx.fill();ctx.restore()}}

/* ================= title & lifecycle ================= */
let demo={x:0,y:0,h:-.5};
function showTitle(){
  mode='title';F=null;S=null;const has=!!loadSave();
  showPanel(`<h1 class="logo">Dead<span>Reckoning</span></h1><div class="sub">Fly supplies between the last working airstrips. Loot what you can on the ground. Find Haven.</div>
  <div class="stack">${has?'<button class="go" data-a="continue">Continue</button>':''}<button class="${has?'ghost':'go'}" data-a="newgame">New run</button><button class="ghost" data-a="help">How to fly</button></div>`,'title');
}
function startNew(){
  const seed=(Math.random()*1e9)|0;genWorld(seed);G=newState(seed);known=new Set([START]);
  const st=strips[START];strips.filter(s=>s.type!=='haven'&&s.id!==START).sort((a,b)=>Math.hypot(a.x-st.x,a.y-st.y)-Math.hypot(b.x-st.x,b.y-st.y)).slice(0,2).forEach(s=>known.add(s.id));
  G.visits[START]=1;G.offers=genOffers(st);enterGround(st);checkpoint();
  toast(`${st.name}. Home, for now.`);setTimeout(()=>toast('Loot the hangars, then board the plane.','mag'),1600);
}
function resumeFrom(st){if(!overview||st.seed!==SEED)genWorld(st.seed);G=st;if(G.time===undefined)G.time=420;if(G.hull===undefined)G.hull=100;if(!G.leak)G.leak=0;if(!G.roadStrips)G.roadStrips=[];if(!G.trinkets)G.trinkets=[];if(G.diff===undefined)G.diff=1;for(const [k,v] of [['band',0],['parts',0],['bombs',0],['armor',0],['rumor',2600]])if(G[k]===undefined)G[k]=v;if(!G.goods)G.goods={};
  strips=strips.filter(s=>s.type!=='road');for(const r of G.roadStrips){r.id=strips.length;strips.push(Object.assign({},r))}if(G.strip>=strips.length)G.strip=START;if(G.nav>=strips.length)G.nav=-1;G.contracts=G.contracts.filter(c=>c.dest<strips.length);known=new Set(G.known||[]);known.add(G.strip);enterGround(strips[G.strip]);checkpoint()}
let last=performance.now();const PERF={t:0,n:0,good:0};
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(document.visibilityState!=='hidden'&&(mode==='flight'||mode==='ground')&&ui===null){PERF.t+=dt;PERF.n++;if(PERF.t>2){const avg=PERF.t/PERF.n;
    if(avg>.022&&QUAL>.55){QUAL=Math.max(.55,QUAL-.12);PERF.good=0;resize()}else if(avg<.0175){PERF.good++;if(PERF.good>=3&&QUAL<1){QUAL=Math.min(1,QUAL+.08);PERF.good=0;resize()}}else PERF.good=0;PERF.t=0;PERF.n=0}}T+=dt;chunkRows=1;
  if(mode==='flight'&&F){if(ui===null){const n=F.cruise&&cruiseOK()?3:1;for(let k=0;k<n&&F&&ui===null&&mode==='flight';k++)updFlight(dt)}if(F)renderFlight()}
  else if(mode==='ground'&&S){if(ui===null)updGround(dt);if(S)renderGround()}
  else{demo.x+=Math.cos(demo.h)*60*dt;demo.y+=Math.sin(demo.h)*60*dt;demo.h+=Math.sin(T*.1)*.02*dt;if(overview)drawWorld(demo.x,demo.y,flightScale(90),T)}
  const fl=mode==='flight'&&F&&ui===null&&!F.crashed;auEngine(fl?(G.fuel>0?F.thr:0):0,F?F.alt:0,!!fl);
  if(AU.ctx&&AU.eng){const rk=ui!==null?0:mode==='flight'&&F?F.storm:mode==='ground'&&S?S.rain:0;AU.eng.rg.gain.setTargetAtTime(rk>.15?rk*.05:0,AU.ctx.currentTime,.4)}
  updateButtons();requestAnimationFrame(frame);
}
(function boot(){
  const sv=loadSave();genWorld(sv?sv.seed:(Math.random()*1e9)|0);
  const st=strips[START];demo={x:st.x,y:st.y,h:-.6};
  showTitle();requestAnimationFrame(frame);
})();
